services:
  api:
    build: .
    container_name: churn-api
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - LOW_RISK_THRESHOLD=0.30
      - HIGH_RISK_THRESHOLD=0.65
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
